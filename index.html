<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATM Santri — Kasir</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --ink: #141414;
      --muted: #64748b;
      --bg: #f4f6f8;
      --card: #ffffff;
      --line: #e2e8f0;
      --ok-bg: #ecfdf5;
      --ok-ink: #065f46;
      --err-bg: #fef2f2;
      --err-ink: #b91c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px 14px 48px;
    }

    .wrap {
      max-width: 440px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      margin-bottom: 14px;
    }

    .title {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .btn-scan-qr {
      width: 100%;
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #e5e7eb;
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-scan-qr:hover {
      background: #dbe0e6;
    }

    .qr-reader-box {
      margin-top: 12px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #000000;
    }

    .field-group {
      margin-top: 14px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .nis-row {
      display: flex;
      gap: 8px;
    }

    .input-control,
    .select-control {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--ink);
      background: #ffffff;
      outline: none;
    }

    .input-control:focus,
    .select-control:focus {
      border-color: var(--ink);
    }

    .btn-dark {
      background: var(--ink);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-dark:hover {
      opacity: 0.92;
    }

    .btn-dark:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-cek {
      padding: 0 18px;
      flex-shrink: 0;
    }

    .btn-submit {
      width: 100%;
      margin-top: 16px;
      padding: 12px 14px;
    }

    .santri-info {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid var(--line);
      font-size: 12.5px;
      line-height: 1.55;
    }

    .alert-box {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      display: none;
    }

    .alert-box.show {
      display: block;
    }

    .alert-box.ok {
      background: var(--ok-bg);
      color: var(--ok-ink);
      border: 1px solid #a7f3d0;
    }

    .alert-box.err {
      background: var(--err-bg);
      color: var(--err-ink);
      border: 1px solid #fecaca;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Kartu Atas: Scan QR & Input NIS -->
    <section class="card">
      <div class="title">ATM Santri — Kasir</div>
      <div class="subtitle">Scan QR kartu atau input NIS santri</div>

      <button id="btnToggleQr" class="btn-scan-qr" type="button">Scan QR</button>
      <div id="qrReaderWrap" class="qr-reader-box hidden">
        <div id="qrReader"></div>
      </div>

      <div class="field-group">
        <label class="field-label" for="inputNis">NIS Santri</label>
        <div class="nis-row">
          <input id="inputNis" class="input-control" type="text" placeholder="Contoh: 2026001" />
          <button id="btnCekNis" class="btn-dark btn-cek" type="button">Cek</button>
        </div>
      </div>

      <div id="santriInfoBox" class="santri-info hidden"></div>
      <div id="cekAlert" class="alert-box"></div>
    </section>

    <!-- Kartu Bawah: Input Transaksi -->
    <section class="card">
      <div class="title">Input Transaksi</div>

      <form id="trxForm">
        <div class="field-group">
          <label class="field-label" for="selectJenis">Jenis Transaksi</label>
          <select id="selectJenis" class="select-control">
            <option value="JAJAN">Jajan / Belanja (Potong Saldo &amp; Limit)</option>
            <option value="TARIK">Tarik Tunai (Potong Saldo &amp; Limit)</option>
            <option value="SETOR">Setor Tunai (Tambah Saldo)</option>
          </select>
        </div>

        <div class="field-group">
          <label class="field-label" for="inputNominal">Nominal (Rp)</label>
          <input id="inputNominal" class="input-control" type="number" min="500" step="500" placeholder="Contoh: 10000" required />
        </div>

        <div class="field-group">
          <label class="field-label" for="inputPin">PIN Santri</label>
          <input id="inputPin" class="input-control" type="password" placeholder="Masukkan PIN" required />
        </div>

        <div class="field-group">
          <label class="field-label" for="inputPetugas">Nama Petugas / Kasir</label>
          <input id="inputPetugas" class="input-control" type="text" placeholder="Contoh: Kasir Kantin 1" required />
        </div>

        <button id="btnProses" class="btn-dark btn-submit" type="submit">Proses Transaksi</button>
      </form>

      <div id="trxAlert" class="alert-box"></div>
    </section>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzmF1tEUXWsAP6YNHXnj9mrXXZS12dzJ301GK_j3eawmDSsHnSQglh34PYY84Jajfp-/exec';

    let html5QrCode = null;
    let isQrRunning = false;

    const formatRp = (n) => 'Rp' + Number(n || 0).toLocaleString('id-ID');

    function showAlert(el, msg, isOk) {
      el.textContent = msg;
      el.className = 'alert-box show ' + (isOk ? 'ok' : 'err');
    }

    function extractNisFromScan(rawText) {
      const txt = String(rawText || '').trim();
      if (!txt) return '';
      try {
        const parsed = JSON.parse(txt);
        if (parsed && parsed.nis) return String(parsed.nis).trim();
      } catch (_) {}
      return txt;
    }

    async function cekDataSantri(nis) {
      const cleanNis = String(nis || '').trim();
      const alertEl = document.getElementById('cekAlert');
      const infoBox = document.getElementById('santriInfoBox');

      if (!cleanNis) {
        showAlert(alertEl, 'Masukkan atau scan NIS santri terlebih dahulu.', false);
        return;
      }

      const btn = document.getElementById('btnCekNis');
      btn.disabled = true;
      btn.textContent = '...';

      try {
        const res = await fetch(`${SCRIPT_URL}?action=getSantri&nis=${encodeURIComponent(cleanNis)}`);
        const json = await res.json();
        if (!json.ok || !json.santri) {
          throw new Error(json.message || 'Santri tidak ditemukan.');
        }

        const s = json.santri;
        infoBox.innerHTML = `
          <div><strong>${s.nama}</strong> (${s.nis}) • ${s.kamar || '-'}</div>
          <div>Status: <strong>${s.status}</strong> • Saldo: <strong>${formatRp(s.saldo)}</strong></div>
          <div>Sisa Limit Hari Ini: <strong>${formatRp(s.sisa_limit)}</strong> dari ${formatRp(s.limit_harian)}</div>
        `;
        infoBox.classList.remove('hidden');
        alertEl.classList.remove('show');
      } catch (err) {
        infoBox.classList.add('hidden');
        showAlert(alertEl, err.message, false);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Cek';
      }
    }

    async function stopQrScanner() {
      if (html5QrCode && isQrRunning) {
        try {
          await html5QrCode.stop();
        } catch (_) {}
      }
      isQrRunning = false;
      document.getElementById('qrReaderWrap').classList.add('hidden');
      document.getElementById('btnToggleQr').textContent = 'Scan QR';
    }

    async function toggleQrScanner() {
      if (isQrRunning) {
        await stopQrScanner();
        return;
      }

      document.getElementById('qrReaderWrap').classList.remove('hidden');
      document.getElementById('btnToggleQr').textContent = 'Tutup Kamera QR';

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode('qrReader');
      }

      try {
        isQrRunning = true;
        await html5QrCode.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          async (decodedText) => {
            const nisHasil = extractNisFromScan(decodedText);
            document.getElementById('inputNis').value = nisHasil;
            await stopQrScanner();
            await cekDataSantri(nisHasil);
          },
          () => {}
        );
      } catch (err) {
        isQrRunning = false;
        document.getElementById('qrReaderWrap').classList.add('hidden');
        document.getElementById('btnToggleQr').textContent = 'Scan QR';
        showAlert(document.getElementById('cekAlert'), 'Kamera tidak dapat diakses: ' + err.message, false);
      }
    }

    document.getElementById('btnToggleQr').addEventListener('click', toggleQrScanner);
    document.getElementById('btnCekNis').addEventListener('click', () => {
      cekDataSantri(document.getElementById('inputNis').value);
    });

    document.getElementById('inputNis').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        cekDataSantri(document.getElementById('inputNis').value);
      }
    });

    document.getElementById('trxForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nis = document.getElementById('inputNis').value.trim();
      const jenis = document.getElementById('selectJenis').value;
      const nominal = Number(document.getElementById('inputNominal').value || 0);
      const pin = document.getElementById('inputPin').value.trim();
      const petugas = document.getElementById('inputPetugas').value.trim();
      const alertEl = document.getElementById('trxAlert');
      const btn = document.getElementById('btnProses');

      if (!nis) {
        showAlert(alertEl, 'NIS santri wajib diisi.', false);
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Memproses...';

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'transaksi',
            nis,
            jenis,
            nominal,
            pin,
            petugas
          })
        });
        const json = await res.json();
        if (!json.ok) {
          throw new Error(json.message || 'Transaksi gagal.');
        }

        showAlert(
          alertEl,
          `${json.message} (${json.id_trx || '-'}) • Saldo Akhir: ${formatRp(json.saldo_akhir)}`,
          true
        );
        document.getElementById('inputNominal').value = '';
        document.getElementById('inputPin').value = '';
        await cekDataSantri(nis);
      } catch (err) {
        showAlert(alertEl, err.message, false);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Proses Transaksi';
      }
    });
  </script>
</body>
</html>
