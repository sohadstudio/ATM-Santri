<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generator QR Code Santri — PPS. NU Raden Keunyeup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --green-dark: #064e3b;
      --green-mid: #065f46;
      --green-main: #059669;
      --green-light: #ecfdf5;
      --green-border: #a7f3d0;
      --ink: #0f172a;
      --muted: #64748b;
      --bg: #f1f5f9;
      --card: #ffffff;
      --line: #e2e8f0;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 20px 16px 40px;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
    }

    .header-box {
      background: linear-gradient(145deg, var(--green-dark) 0%, var(--green-main) 100%);
      color: #ffffff;
      padding: 20px 22px;
      border-radius: 22px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .header-title {
      font-size: 19px;
      font-weight: 800;
    }

    .header-sub {
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.86);
      margin-top: 3px;
    }

    .badge-qr {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 720px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
    }

    .card-title {
      font-size: 14.5px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .field-group {
      margin-bottom: 12px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .input-control,
    .select-control {
      width: 100%;
      padding: 10px 13px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--ink);
      background: #f8fafc;
      outline: none;
    }

    .input-control:focus,
    .select-control:focus {
      background: #ffffff;
      border-color: var(--green-main);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.14);
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--green-main);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--green-mid);
    }

    .btn-soft {
      background: var(--green-light);
      color: var(--green-dark);
      border: 1px solid var(--green-border);
    }

    .btn-outline {
      background: #ffffff;
      color: var(--ink);
      border: 1px solid #cbd5e1;
    }

    .qr-preview-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      border: 1.5px dashed var(--green-border);
      background: #f8fafc;
      border-radius: 18px;
      min-height: 270px;
      text-align: center;
    }

    .qr-box {
      background: #ffffff;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      display: inline-grid;
      place-items: center;
    }

    .qr-info-nama {
      margin-top: 12px;
      font-size: 15px;
      font-weight: 800;
    }

    .qr-info-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .status-msg.err {
      color: var(--danger);
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .header-box,
      .no-print {
        display: none !important;
      }
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .card {
        box-shadow: none;
        border: 1px solid #cbd5e1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header-box">
      <div>
        <div class="header-title">Generator QR Code Santri</div>
        <div class="header-sub">PPS. NU Raden Keunyeup • Tahun Ajaran 2026-2027</div>
      </div>
      <div class="badge-qr">Mode QR Code Saja</div>
    </header>

    <div class="grid-2">
      <!-- Form Input / Ambil Data Santri -->
      <section class="card no-print">
        <h2 class="card-title">Data Santri untuk QR Code</h2>

        <div class="field-group">
          <label class="field-label" for="selectSantri">Ambil dari Database Santri (Opsional)</label>
          <div style="display:flex; gap:8px;">
            <select id="selectSantri" class="select-control">
              <option value="">-- Pilih Santri atau Isi Manual --</option>
            </select>
            <button id="btnLoadSantri" class="btn btn-soft" type="button">Muat</button>
          </div>
        </div>

        <form id="qrForm">
          <div class="field-group">
            <label class="field-label" for="inputNis">NIS Santri (Isi QR Code)</label>
            <input id="inputNis" class="input-control" type="text" placeholder="Contoh: 2026001" required />
          </div>

          <div class="field-group">
            <label class="field-label" for="inputNama">Nama Santri</label>
            <input id="inputNama" class="input-control" type="text" placeholder="Contoh: Abdul Hadi" />
          </div>

          <div class="field-group">
            <label class="field-label" for="inputKamar">Kamar / Asrama</label>
            <input id="inputKamar" class="input-control" type="text" placeholder="Contoh: Aspontren" />
          </div>

          <div class="field-group">
            <label class="field-label" for="selectFormatQr">Isi Data QR Code</label>
            <select id="selectFormatQr" class="select-control">
              <option value="NIS_ONLY">Hanya NIS (Direkomendasikan untuk Kasir)</option>
              <option value="JSON_SANTRI">Format JSON (NIS, Nama, Kamar)</option>
            </select>
          </div>

          <div class="btn-row">
            <button class="btn btn-primary" type="submit">Generate QR Code</button>
            <button id="btnDownloadQr" class="btn btn-soft" type="button">Unduh PNG</button>
            <button id="btnPrintQr" class="btn btn-outline" type="button">Cetak</button>
          </div>
        </form>

        <div id="statusMsg" class="status-msg"></div>
      </section>

      <!-- Pratinjau QR Code -->
      <section class="card">
        <h2 class="card-title">Pratinjau QR Code</h2>
        <div class="qr-preview-wrap">
          <div id="qrCanvasContainer" class="qr-box"></div>
          <div id="previewNama" class="qr-info-nama">Belum ada QR Code</div>
          <div id="previewDetail" class="qr-info-sub">Masukkan NIS lalu klik Generate QR Code</div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzmF1tEUXWsAP6YNHXnj9mrXXZS12dzJ301GK_j3eawmDSsHnSQglh34PYY84Jajfp-/exec';

    let qrInstance = null;
    let santriCache = [];

    function setStatus(msg, isErr = false) {
      const el = document.getElementById('statusMsg');
      el.textContent = msg;
      el.className = 'status-msg' + (isErr ? ' err' : '');
    }

    function buildQrPayload(nis, nama, kamar, mode) {
      if (mode === 'JSON_SANTRI') {
        return JSON.stringify({
          nis: String(nis).trim(),
          nama: String(nama || '').trim(),
          kamar: String(kamar || '').trim()
        });
      }
      return String(nis).trim();
    }

    function renderQrCode(nis, nama, kamar, mode) {
      const cleanNis = String(nis || '').trim();
      if (!cleanNis) {
        setStatus('NIS santri wajib diisi.', true);
        return;
      }

      const payload = buildQrPayload(cleanNis, nama, kamar, mode);
      const container = document.getElementById('qrCanvasContainer');
      container.innerHTML = '';

      qrInstance = new QRCode(container, {
        text: payload,
        width: 190,
        height: 190,
        colorDark: '#064e3b',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      document.getElementById('previewNama').textContent = nama ? nama.trim() : 'Santri';
      document.getElementById('previewDetail').textContent =
        `NIS: ${cleanNis}${kamar ? ' • ' + kamar.trim() : ''}`;
      setStatus('QR Code berhasil dibuat.');
    }

    async function fetchSantriList() {
      const btn = document.getElementById('btnLoadSantri');
      btn.disabled = true;
      btn.textContent = '...';
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getSantriList`);
        const json = await res.json();
        if (json && json.ok && Array.isArray(json.santri)) {
          santriCache = json.santri;
          const sel = document.getElementById('selectSantri');
          sel.innerHTML = '<option value="">-- Pilih Santri --</option>';
          santriCache.forEach((s, idx) => {
            const opt = document.createElement('option');
            opt.value = String(idx);
            opt.textContent = `${s.nis} - ${s.nama}`;
            sel.appendChild(opt);
          });
          setStatus(`Berhasil memuat ${santriCache.length} data santri.`);
        } else {
          setStatus('Daftar santri belum tersedia di endpoint; silakan ketik NIS/Nama manual.', false);
        }
      } catch (_) {
        setStatus('Mode input manual aktif (isi NIS & Nama langsung).', false);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Muat';
      }
    }

    document.getElementById('selectSantri').addEventListener('change', (e) => {
      const idx = Number(e.target.value);
      const item = santriCache[idx];
      if (!item) return;
      document.getElementById('inputNis').value = item.nis || '';
      document.getElementById('inputNama').value = item.nama || '';
      document.getElementById('inputKamar').value = item.kamar || '';
      renderQrCode(
        item.nis,
        item.nama,
        item.kamar,
        document.getElementById('selectFormatQr').value
      );
    });

    document.getElementById('btnLoadSantri').addEventListener('click', fetchSantriList);

    document.getElementById('qrForm').addEventListener('submit', (e) => {
      e.preventDefault();
      renderQrCode(
        document.getElementById('inputNis').value,
        document.getElementById('inputNama').value,
        document.getElementById('inputKamar').value,
        document.getElementById('selectFormatQr').value
      );
    });

    document.getElementById('btnDownloadQr').addEventListener('click', () => {
      const nis = document.getElementById('inputNis').value.trim();
      const canvas = document.querySelector('#qrCanvasContainer canvas');
      const img = document.querySelector('#qrCanvasContainer img');

      let dataUrl = '';
      if (canvas) {
        dataUrl = canvas.toDataURL('image/png');
      } else if (img && img.src) {
        dataUrl = img.src;
      }

      if (!dataUrl) {
        setStatus('Generate QR Code terlebih dahulu sebelum mengunduh.', true);
        return;
      }

      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = `QR-Santri-${nis || 'kode'}.png`;
      link.click();
    });

    document.getElementById('btnPrintQr').addEventListener('click', () => {
      window.print();
    });

    // Tampilkan contoh awal saat halaman dibuka
    renderQrCode('2026001', 'Abdul Hadi', 'Aspontren', 'NIS_ONLY');
  </script>
</body>
</html>
